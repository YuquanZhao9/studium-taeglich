<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studium">
<title>Studium täglich</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: 昱时-style cool grey desk. Desktop = left rail (dates) | study column (today/tomorrow cards) | sticky PDF pane.
   Phone = top bar + segmented today/tomorrow, PDF opens as a full-screen sheet. Course colours carry through chips and card edges. */
:root {
  --bg: #f6f7fa; --card: #ffffff; --ink: #2f3342; --muted: #8a8fa0; --line: #e4e7ee;
  --accent: #6474d2; --accent-soft: #edf0fc; --warn: #b7791f; --bad: #d8584f; --on-accent: #ffffff;
  --c-AM: #3b6fd1; --c-SASP: #2f8a4e; --c-MC: #b9800f; --c-ITCL: #8a55c9; --c-AR: #d8584f; --c-iCPS: #6b7280;
  --ui: "IBM Plex Sans", -apple-system, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  --read: "Source Serif 4", Georgia, "Songti SC", "Noto Serif SC", "SimSun", serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px; --mtop-h: 48px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111217; --card: #1c1d24; --ink: #e8e9ef; --muted: #8e93a4; --line: #2a2c36;
  --accent: #8b98e8; --accent-soft: #262a45; --warn: #e3b34a; --bad: #f07a7d; --on-accent: #111217;
  --c-AM: #7aa2f2; --c-SASP: #6cc48d; --c-MC: #e3b34a; --c-ITCL: #b892ec; --c-AR: #f07a7d; --c-iCPS: #a3a8b6;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111217; --card: #1c1d24; --ink: #e8e9ef; --muted: #8e93a4; --line: #2a2c36;
  --accent: #8b98e8; --accent-soft: #262a45; --warn: #e3b34a; --bad: #f07a7d; --on-accent: #111217;
  --c-AM: #7aa2f2; --c-SASP: #6cc48d; --c-MC: #e3b34a; --c-ITCL: #b892ec; --c-AR: #f07a7d; --c-iCPS: #a3a8b6;
  color-scheme: dark }

* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }
.lock { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: var(--bg); }
.lock form { width: min(360px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px 22px; display: grid; gap: 14px; }
.lock h1 { margin: 0; font-size: 20px; }
.lock p { margin: 0; color: var(--muted); font-size: 13px; }
.lock input { font: 16px var(--mono); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
.lock .err { color: var(--bad); min-height: 1.2em; }
.gh { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
.gh input { font: 12px var(--mono); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); width: 100%; }
.gh a { color: var(--accent); }
.gh.need { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 4px; }
.gh summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.gh b { color: var(--ink); font-weight: 500; }
.gh .row2 { display: flex; gap: 6px; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.55; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 210px minmax(0, 1fr) minmax(0, 1.05fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; padding-block: 22px; padding-inline: 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 22px; }
.brand { font-weight: 600; font-size: 18px; line-height: 1.2; }
.brand small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 4px; }
.label { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.dates { display: grid; gap: 2px; }
.dates button { all: unset; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
.dates button:hover { background: var(--accent-soft); }
.dates button:focus-visible { outline: 2px solid var(--accent); }
.dates button[aria-current="true"] { background: var(--accent); color: var(--on-accent); }
.dates button span:last-child { opacity: .7; font-size: 12px; }
.sync { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-top: auto; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--c-SASP); }

.main { padding-block: 22px 60px; padding-inline: 24px; min-width: 0; display: grid; gap: 18px; align-content: start; }
.mtop { display: none; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 3; box-shadow: 0 -12px 0 var(--bg); }
.seg button { border: 0; background: none; padding: 8px; border-radius: 7px; cursor: pointer; font-weight: 500; display: flex; gap: 8px; justify-content: center; align-items: baseline; }
.seg button small { color: var(--muted); font: 12px var(--mono); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg button[aria-pressed="true"] small { color: var(--accent); }

.dayhead h1 { font-size: 22px; margin: 0; text-wrap: balance; }
.dayhead p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.empty, .remind { background: var(--card); border: 1px dashed var(--line); border-radius: var(--r); padding: 16px; color: var(--muted); }
.remind { border-style: solid; color: var(--warn); }

.cards { display: grid; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; border-top: 3px solid var(--cc, var(--accent)); min-width: 0; }
.card.active { box-shadow: 0 0 0 2px var(--cc, var(--accent)); }
.card.dim { opacity: .72; }
.chead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.time { font: 500 14px var(--mono); font-variant-numeric: tabular-nums; }
.chip { font-size: 12px; font-weight: 600; color: var(--cc); background: color-mix(in srgb, var(--cc) 14%, transparent); border-radius: 999px; padding: 1px 9px; }
.kind { font-weight: 600; }
.ord { color: var(--muted); font-size: 13px; }
.room { color: var(--muted); font-size: 13px; }
.topic { font-family: var(--read); font-size: 16px; }
.note { color: var(--muted); font-size: 13px; }
.secs { display: flex; flex-wrap: wrap; gap: 6px; }
.secs button { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 4px 9px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; max-width: 100%; }
.secs button:hover { border-color: var(--cc); }
.secs button b { font: 500 11px var(--mono); color: var(--muted); }
.secs button span { overflow-wrap: anywhere; text-align: left; }

.block { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; min-width: 0; }
.bhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.bhead h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.bhead .tag { font: 11px var(--mono); color: var(--muted); }
.tool { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.tool.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.md { font-family: var(--read); font-size: 15.5px; line-height: 1.7; max-width: 68ch; overflow-wrap: anywhere; min-width: 0; }
.md h4 { font-family: var(--ui); font-size: 14px; margin: 12px 0 2px; color: var(--cc, var(--accent)); }
.md h4:first-child { margin-top: 0; }
.md p { margin: 4px 0; }
.md ul { margin: 4px 0; padding-left: 20px; }
.md code { font-family: var(--mono); font-size: 13px; background: var(--bg); padding: 0 4px; border-radius: 4px; }
.md .f { display: block; font-family: var(--mono); font-size: 13.5px; background: var(--bg); border-left: 3px solid var(--cc, var(--accent)); padding: 6px 10px; margin: 6px 0; overflow-x: auto; white-space: pre; }
.muted { color: var(--muted); font-size: 14px; }
textarea { width: 100%; min-height: 180px; resize: vertical; font: 14px/1.6 var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
textarea.notes { font-family: var(--read); font-size: 15px; min-height: 90px; }
.row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
details.files summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.files ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
details.files code { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }

.extra { display: grid; gap: 10px; }
.extra ul { margin: 0; padding-left: 18px; }
.extra li { margin: 2px 0; }
.extra code { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.pill { font: 500 12px var(--mono); color: var(--warn); }

.viewer { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; border-left: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; background: var(--bg); }
.vhead { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); min-width: 0; }
.vhead .vt { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vhead .vp { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.vclose { display: none; }
.pages { position: relative; overflow-y: auto; padding: 14px 16px 40px; display: grid; gap: 12px; align-content: start; }
.page { background: #ffffff; border-radius: 4px; box-shadow: 0 1px 3px rgba(20, 24, 40, .14); position: relative; max-width: 100%; }
.page canvas { display: block; width: 100%; height: auto; border-radius: 4px; }
.page .no { position: absolute; right: 8px; bottom: 6px; font: 11px var(--mono); color: #8a8fa0; }
.pnote { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--cc, var(--accent)); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.pnote .pn-h { font: 500 11px var(--mono); letter-spacing: .06em; color: var(--cc, var(--accent)); margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ptrans { background: var(--accent-soft); border-radius: 6px; padding: 8px 14px 10px; font-size: 14px; margin-top: -6px; }
.ptrans .pn-h { font: 500 11px var(--mono); letter-spacing: .06em; color: var(--accent); margin-bottom: 2px; }
.ptrans .md h4 { margin: 2px 0 4px; font-size: 14px; }
.ptrans ul { margin: 2px 0; padding-left: 18px; }
#trbtn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.pnote textarea { width: 100%; min-height: 220px; font: 13px/1.5 var(--mono); padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.pnote .row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
.pnote .md h4 { margin-top: 2px; }
.psec { font-size: 12px; font-weight: 600; color: var(--accent); padding-top: 6px; }

@media (max-width: 1180px) { .app { grid-template-columns: 190px minmax(0, 1fr) minmax(0, 0.9fr); } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .mtop { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: var(--mtop-h); align-items: center; justify-content: space-between; gap: 10px; margin-inline: -16px; margin-top: -12px; padding: 0 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .mtop .brand { font-size: 16px; }
  .mtop select { font: 14px var(--ui); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; max-width: 50%; }
  .main { padding-inline: 16px; padding-block: 12px 48px; }
  .seg { top: calc(env(safe-area-inset-top, 0px) + var(--mtop-h) + 8px); }
  .viewer { position: fixed; inset: 0; z-index: 10; height: auto; border: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .viewer:not(.open) { display: none; }
  .vclose { display: inline-block; }
  .pages { padding-inline: 10px; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: box-shadow .15s; } }
</style>
</head>
<body>
<div class="lock" id="lock">
  <form id="lockf" autocomplete="on">
    <h1>Studium täglich</h1>
    <p>输入密码打开今天的学习资料。这台设备只需输一次。</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="密码" aria-label="密码" required>
    <button class="tool primary" type="submit" id="pwbtn">打开</button>
    <div class="err" id="pwerr"></div>
  </form>
</div>

<div class="app">
  <nav class="rail" aria-label="日期">
    <div class="brand">Studium täglich<small>Uni Stuttgart · WS 2026/27</small></div>
    <div><p class="label">日期</p><div class="dates" id="dates"></div></div>
    <div class="sync"><span class="dot" id="dot"></span><span id="synctxt">连接中</span></div>
    <details class="gh" id="ghbox"><summary id="ghsum">✏️ 开启在线编辑</summary><b id="ghmsg" hidden>先在这里填一次 GitHub 令牌，之后就能直接编辑讲解、写笔记。</b>
      <span>在电脑上编辑讲解、写笔记需要一个 GitHub 令牌（只授权 studium-taeglich 仓库的 Contents 读写）。<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">去生成</a></span>
      <input id="ghtok" type="password" placeholder="github_pat_…" aria-label="GitHub 令牌">
      <div class="row2"><button class="tool primary" type="button" id="ghsave">保存</button><button class="tool" type="button" id="ghclear">清除</button><button class="tool" type="button" id="lockout">退出</button></div>
    </details>
  </nav>

  <main class="main">
    <div class="mtop"><div class="brand">Studium täglich</div><select id="dsel" aria-label="选择日期"></select></div>
    <div class="seg" id="seg" role="group" aria-label="今天或明天"></div>
    <div class="dayhead" id="dayhead"></div>
    <div class="cards" id="cards"><div class="empty">正在载入……</div></div>
    <div class="extra" id="extra"></div>
  </main>

  <aside class="viewer" id="viewer" aria-label="资料 PDF">
    <div class="vhead"><span class="vt" id="vt">资料合集</span><span class="vp" id="vp"></span><button class="tool" id="trbtn" type="button" aria-pressed="false" hidden>中文对照</button><button class="tool vclose" id="vclose" type="button">关闭</button></div>
    <div class="pages" id="pages"><p class="muted">选一节课的资料，在这里翻看。</p></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const WD = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  const desktopMQ = window.matchMedia("(min-width: 901px) and (pointer: fine)");
  const S = { manifest: [], date: null, view: null, dayIdx: 0, pdf: null, pdfFile: null, pageBoxes: [], explain: {}, notes: {}, db: null, editing: null, loadToken: 0 };

  const md = d => { const x = new Date(d + "T12:00:00"); return (x.getMonth() + 1) + "/" + x.getDate(); };
  const wd = d => WD[new Date(d + "T12:00:00").getDay()];
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const cssId = k => k.replace(/[^a-zA-Z0-9]/g, "_");
  function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>"); }
  function renderMd(text) {
    const out = []; let list = null, para = [];
    const flushP = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
    const flushL = () => { if (list) { out.push("<ul>" + list.map(li => "<li>" + inline(li) + "</li>").join("") + "</ul>"); list = null; } };
    for (const raw of String(text || "").split("\n")) {
      const line = raw.trimEnd();
      if (/^#{2,4}\s/.test(line)) { flushP(); flushL(); out.push("<h4>" + inline(line.replace(/^#+\s/, "").replace(/\s+@\d+\s*$/, "")) + "</h4>"); }
      else if (/^\s*[-*]\s/.test(line)) { flushP(); (list = list || []).push(line.replace(/^\s*[-*]\s/, "")); }
      else if (/^>\s?/.test(line)) { flushP(); flushL(); out.push('<span class="f">' + esc(line.replace(/^>\s?/, "")) + "</span>"); }
      else if (!line.trim()) { flushP(); flushL(); }
      else { flushL(); para.push(line); }
    }
    flushP(); flushL(); return out.join("");
  }
  // Split an explanation into "## " chunks. A heading ending in "@k" belongs after page k of that session.
  function chunks(text) {
    const out = [];
    for (const line of String(text || "").split("\n")) {
      if (/^#{2}\s/.test(line) || !out.length) { const m = line.match(/\s@(\d+)\s*$/); out.push({ at: m ? +m[1] : null, lines: [] }); }
      out[out.length - 1].lines.push(line);
    }
    return out.map(c => ({ at: c.at, md: c.lines.join("\n").trim() })).filter(c => c.md);
  }

  // ---------- crypto ----------
  const REPO = "YuquanZhao9/studium-taeglich", DATA_BRANCH = "userdata", DATA_PATH = "user.enc";
  const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
  const b64 = { dec(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; },
    enc(u) { let s = ""; const c = 0x8000; for (let i = 0; i < u.length; i += c) s += String.fromCharCode.apply(null, u.subarray(i, i + c)); return btoa(s); } };
  let KEY = null;
  async function decryptBytes(u) { return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, KEY, u.slice(12))); }
  async function encryptBytes(u) { const iv = crypto.getRandomValues(new Uint8Array(12)); const c = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, KEY, u)); const o = new Uint8Array(12 + c.length); o.set(iv); o.set(c, 12); return o; }
  async function getEnc(path) { const r = await fetch(path + ".enc", { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return decryptBytes(new Uint8Array(await r.arrayBuffer())); }
  async function getEncJson(path) { return JSON.parse(new TextDecoder().decode(await getEnc(path))); }
  async function importRaw(raw) { return crypto.subtle.importKey("raw", raw, "AES-GCM", true, ["encrypt", "decrypt"]); }
  async function tryKey(k) { const meta = await (await fetch("key.json", { cache: "no-store" })).json(); KEY = k; try { await decryptBytes(b64.dec(meta.check)); return true; } catch (e) { KEY = null; return false; } }
  async function unlockWith(pw) {
    const meta = await (await fetch("key.json", { cache: "no-store" })).json();
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64.dec(meta.salt), iterations: meta.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    if (!(await tryKey(k))) return false;
    ls.set("st-key", b64.enc(new Uint8Array(await crypto.subtle.exportKey("raw", k))));
    return true;
  }

  // ---------- data ----------
  async function loadManifest() {
    S.manifest = await getEncJson("manifest.json");
    const dates = $("dates"), sel = $("dsel");
    dates.innerHTML = ""; sel.innerHTML = "";
    S.manifest.forEach(m => {
      const b = document.createElement("button"); b.type = "button"; b.dataset.date = m.date;
      b.innerHTML = "<span>" + md(m.date) + " " + wd(m.date) + "</span><span>" + m.pages + " 页</span>";
      b.addEventListener("click", () => openDate(m.date));
      dates.appendChild(b);
      const o = document.createElement("option"); o.value = m.date; o.textContent = md(m.date) + " " + wd(m.date); sel.appendChild(o);
    });
    sel.addEventListener("change", () => openDate(sel.value));
    const want = (location.hash || "").replace("#d", "");
    const hit = S.manifest.find(m => m.date.replaceAll("-", "") === want);
    openDate((hit || S.manifest[0] || {}).date);
  }

  async function openDate(date) {
    if (!date) { $("cards").innerHTML = '<div class="empty">还没有资料。</div>'; return; }
    S.date = date; S.dayIdx = 0; S.editing = null;
    [...$("dates").children].forEach(b => b.setAttribute("aria-current", b.dataset.date === date ? "true" : "false"));
    $("dsel").value = date;
    try {
      S.view = await getEncJson("days/" + date + ".json");
    } catch (e) { S.view = null; $("cards").innerHTML = '<div class="empty">这一天的课表没有载入，刷新一下试试。</div>'; return; }
    render();
    loadPdf(S.view.pdf);
  }

  // ---------- render ----------
  function render() {
    const v = S.view; if (!v) return;
    const seg = $("seg"); seg.innerHTML = "";
    v.days.forEach((d, i) => {
      const b = document.createElement("button"); b.type = "button";
      b.setAttribute("aria-pressed", i === S.dayIdx ? "true" : "false");
      b.innerHTML = esc(d.label) + " <small>" + md(d.date) + " " + esc(d.weekday) + "</small>";
      b.addEventListener("click", () => { S.dayIdx = i; S.editing = null; render(); });
      seg.appendChild(b);
    });
    const d = v.days[S.dayIdx];
    const n = d.items.filter(x => !x.self && !x.note).length;
    $("dayhead").innerHTML = "<h1>" + esc(d.label) + " · " + md(d.date) + " " + esc(d.weekday) + "</h1><p>" +
      (n ? n + " 节课 / 活动" : "没有课") + (v.pages ? " · 资料合集 " + v.pages + " 页" : "") + "</p>";
    const cards = $("cards"); cards.innerHTML = "";
    if (d.reminder) cards.insertAdjacentHTML("beforeend", '<div class="remind">📝 ' + esc(d.reminder) + "</div>");
    if (d.message) cards.insertAdjacentHTML("beforeend", '<div class="empty">' + esc(d.message) + "</div>");
    d.items.forEach(item => cards.appendChild(card(item)));
    renderExtra();
    placeNotes();
  }

  const trOn = () => { try { return localStorage.getItem("st-tr") !== "0"; } catch (e) { return true; } };
  $("trbtn").addEventListener("click", () => { try { localStorage.setItem("st-tr", trOn() ? "0" : "1"); } catch (e) {} placeNotes(); });
  const canEdit = () => !!(desktopMQ.matches && S.db);
  // Put each explanation chunk into the PDF column, right after the slide it talks about.
  function placeNotes() {
    const pages = $("pages"); if (!S.pdf || !S.view) return;
    pages.querySelectorAll(".pnote, .ptrans").forEach(n => n.remove());
    const showTr = trOn();
    $("trbtn").setAttribute("aria-pressed", showTr ? "true" : "false");
    let anyTr = false;
    S.view.days.forEach(d => d.items.forEach(it => {
      const tr = it.translation || {}; if (!it.sections.length || !Object.keys(tr).length) return;
      anyTr = true; if (!showTr) return;
      const base = it.sections[0].page;
      Object.keys(tr).forEach(k => {
        const box = S.pageBoxes[base + (+k) - 1]; if (!box || !tr[k]) return;
        const el = document.createElement("div"); el.className = "ptrans";
        el.innerHTML = '<div class="pn-h"><span>' + esc(it.course) + " · 第 " + (base + (+k) - 1) + ' 页 · 中文</span></div><div class="md">' + renderMd(tr[k]) + "</div>";
        box.after(el);
      });
    }));
    $("trbtn").hidden = !anyTr;
    S.view.days.forEach(d => d.items.forEach(it => {
      if (!it.sections.length || it.note || it.self) return;
      const text = currentExplain(it).text; if (!text) return;
      const base = it.sections[0].page, last = it.sections[it.sections.length - 1], end = last.page + last.count - 1;
      const cs = chunks(text);
      cs.forEach((c, i) => {
        const el = document.createElement("div"); el.className = "pnote"; el.style.setProperty("--cc", "var(--c-" + it.course + ")");
        const eid = "p:" + it.key + ":" + i;
        if (S.editing === eid) {
          el.innerHTML = '<div class="pn-h">' + esc(it.course + " " + it.kind) + ' · 编辑这段</div><textarea></textarea><div class="row"><button class="tool" type="button" data-a="cancel">取消</button><button class="tool primary" type="button" data-a="save">保存</button></div>';
          const ta = el.querySelector("textarea"); ta.value = c.md; setTimeout(() => ta.focus(), 0);
          el.querySelector('[data-a="cancel"]').onclick = () => { S.editing = null; placeNotes(); };
          el.querySelector('[data-a="save"]').onclick = async () => {
            const all = chunks(currentExplain(it).text); all[i] = { at: c.at, md: ta.value.trim() };
            const ok = await saveDoc("explain", it.key, { md: all.map(x => x.md).filter(Boolean).join("\n\n"), updatedAt: Date.now() });
            if (ok) { S.editing = null; render(); }
          };
        } else {
          el.innerHTML = '<div class="pn-h"><span>' + esc(it.course + " " + it.kind) + " · 讲解</span>" + (desktopMQ.matches ? '<button class="tool" type="button">编辑</button>' : "") + "</div><div class=\"md\">" + renderMd(c.md) + "</div>";
          const eb = el.querySelector(".pn-h .tool"); if (eb) eb.onclick = () => { if (!canEdit()) return needEdit(); S.editing = eid; placeNotes(); };
        }
        if (i === 0 && c.at == null) { const b = S.pageBoxes[base]; if (b) b.before(el); return; }
        const k = c.at == null ? end : Math.min(end, Math.max(base, base + c.at - 1));
        const box = S.pageBoxes[k]; if (!box) return;
        let after = box; while (after.nextElementSibling && /\bp(note|trans)\b/.test(after.nextElementSibling.className)) after = after.nextElementSibling;
        after.after(el);
      });
    }));
  }

  function card(it) {
    const el = document.createElement("article");
    el.className = "card" + (it.note || it.self ? " dim" : "");
    el.style.setProperty("--cc", "var(--c-" + it.course + ")");
    el.dataset.key = it.key;
    let h = '<div class="chead"><span class="time">' + esc(it.start) + "–" + esc(it.end) + '</span><span class="chip">' + esc(it.course) +
      '</span><span class="kind">' + esc(it.kind) + "</span>" + (it.ordinal && it.type === "session" && !it.self ? '<span class="ord">第 ' + it.ordinal + " 次</span>" : "") +
      '</div><div class="room">📍 ' + esc(it.room) + "</div>";
    if (it.note) h += '<div class="note">' + esc(it.note) + "</div>";
    if (it.topic) h += '<div class="topic">' + esc(it.topic) + "</div>";
    if (it.sections.length) {
      h += '<div class="secs">' + it.sections.map((s, i) => '<button type="button" data-i="' + i + '"><span>' + esc(s.title.split(" · ").slice(1).join(" · ")) + "</span><b>" + s.count + " 页</b></button>").join("") + "</div>";
    }
    el.innerHTML = h;
    el.querySelectorAll(".secs button").forEach(b => b.addEventListener("click", () => showSection(it, +b.dataset.i, el)));
    if (it.type === "session" && !it.note && !it.self) {
      el.appendChild(explainBlock(it));
      el.appendChild(notesBlock(it));
    }
    if (it.files.length && it.folder) {
      const det = document.createElement("details"); det.className = "files";
      det.innerHTML = "<summary>F 盘里的原文件</summary><ul>" + it.files.map(f => "<li><code>" + esc(it.folder) + "\\</code>" + esc(f) + "</li>").join("") + "</ul>";
      el.appendChild(det);
    }
    return el;
  }

  function currentExplain(it) {
    const e = S.explain[it.key];
    if (e && typeof e.md === "string") return { text: e.md, edited: true };
    return { text: it.explain || "", edited: false };
  }

  function explainBlock(it) {
    const b = document.createElement("div"); b.className = "block";
    const editable = desktopMQ.matches;
    const ex = currentExplain(it);
    if (S.editing === "x:" + it.key) {
      b.innerHTML = '<div class="bhead"><h3>讲解（编辑中）</h3><span class="tag">## 小标题（末尾写 @页 就插到这节课第几页后）　- 列表　&gt; 公式行　**加粗**</span></div><textarea id="ta-' + cssId(it.key) + '"></textarea><div class="row"><button class="tool" type="button" data-a="reset">恢复原版</button><button class="tool" type="button" data-a="cancel">取消</button><button class="tool primary" type="button" data-a="save">保存</button></div>';
      const ta = b.querySelector("textarea"); ta.value = ex.text; setTimeout(() => ta.focus(), 0);
      b.querySelector('[data-a="cancel"]').onclick = () => { S.editing = null; render(); };
      b.querySelector('[data-a="save"]').onclick = async () => { await saveDoc("explain", it.key, { md: ta.value, updatedAt: Date.now() }); S.editing = null; render(); };
      b.querySelector('[data-a="reset"]').onclick = async () => { await deleteDoc("explain", it.key); S.editing = null; render(); };
      return b;
    }
    const cs = chunks(ex.text), first = cs[0] && cs[0].at == null ? cs[0] : null, rest = cs.length - (first ? 1 : 0);
    b.innerHTML = '<div class="bhead"><h3>讲解' + (ex.edited ? " · 已改过" : "") + "</h3>" + (desktopMQ.matches ? '<button class="tool" type="button" data-a="edit">编辑</button>' : "") + "</div>" +
      (ex.text ? (first ? '<div class="md">' + renderMd(first.md) + "</div>" : "") +
        (rest && it.sections.length ? '<p class="muted">其余 ' + rest + ' 段讲解插在课件里对应的那页后面。<button class="tool" type="button" data-a="go">在课件里看</button></p>' : "")
        : '<p class="muted">这节课的讲解还没写好，早上的推送会补上。</p>');
    const btn = b.querySelector('[data-a="edit"]'); if (btn) btn.onclick = () => { if (!canEdit()) return needEdit(); S.editing = "x:" + it.key; render(); };
    const go = b.querySelector('[data-a="go"]'); if (go) go.onclick = () => showSection(it, 0, go.closest(".card"));
    return b;
  }

  function notesBlock(it) {
    const b = document.createElement("div"); b.className = "block";
    const text = (S.notes[it.key] || {}).text || "";
    const editable = desktopMQ.matches;
    if (editable) {
      b.innerHTML = '<div class="bhead"><h3>我的笔记</h3><span class="tag" id="st-' + cssId(it.key) + '"></span></div><textarea class="notes" placeholder="课前疑问、课上要点、课后要复习的地方……自动保存"></textarea>';
      const ta = b.querySelector("textarea"); ta.value = text; ta.id = "n-" + cssId(it.key);
      let t = null;
      ta.addEventListener("input", () => { clearTimeout(t); status(it.key, "未保存"); t = setTimeout(() => saveNote(it.key, ta.value), 1200); });
      ta.addEventListener("blur", () => { clearTimeout(t); if (ta.value !== ((S.notes[it.key] || {}).text || "")) saveNote(it.key, ta.value); });
    } else {
      b.innerHTML = '<div class="bhead"><h3>我的笔记</h3></div>' + (text ? '<div class="md">' + renderMd(text) + "</div>" : '<p class="muted">' + "在电脑上打开这一页就能写笔记。" + "</p>");
    }
    return b;
  }
  function status(key, txt) { const e = $("st-" + cssId(key)); if (e) e.textContent = txt; }
  async function saveNote(key, text) {
    status(key, "保存中……");
    const ok = await saveDoc("notes", key, { text, updatedAt: Date.now() });
    status(key, ok ? "已保存" : "没保存上，稍后再试");
  }

  function renderExtra() {
    const v = S.view, x = $("extra"); let h = "";
    if (v.deadlines && v.deadlines.length) {
      h += '<div class="card" style="--cc: var(--warn)"><div class="bhead"><h3>近期截止与重要日期</h3></div><ul>' +
        v.deadlines.map(d => '<li><span class="pill">' + md(d.date) + (d.inDays === 0 ? " 今天" : " · " + d.inDays + " 天后") + "</span> " + esc(d.text) + "</li>").join("") + "</ul></div>";
    }
    if (v.newFiles && v.newFiles.length) {
      h += '<div class="card"><div class="bhead"><h3>F 盘新增资料</h3></div><ul>' + v.newFiles.map(f => "<li><code>" + esc(f) + "</code></li>").join("") + "</ul></div>";
    }
    h += '<p class="muted" style="font-size:12px">资料目录索引更新于 ' + esc(v.indexDate || "") + "。每次课的内容按章节和去年进度推算；进度不对，在 Claude 项目「Stuttgart课程」的每日学习推送对话里说一声。</p>";
    x.innerHTML = h;
  }

  function needEdit() {
    const box = $("ghbox"); box.open = true; box.classList.add("need"); $("ghmsg").hidden = false;
    $("ghtok").focus(); box.scrollIntoView({ block: "nearest" });
  }
  // ---------- GitHub store (encrypted user.enc on branch userdata) ----------
  // S.db is truthy when edits can be saved (desktop with a token). Reads work without a token.
  const API = "https://api.github.com/repos/" + REPO + "/contents/" + DATA_PATH;
  let dataSha = null, queue = Promise.resolve();
  const tok = () => ls.get("st-gh") || "";
  const hdr = () => { const h = { Accept: "application/vnd.github+json" }; if (tok()) h.Authorization = "Bearer " + tok(); return h; };
  function setSync(on, txt) { $("dot").classList.toggle("on", on); $("synctxt").textContent = txt; }
  async function pull() {
    const r = await fetch(API + "?ref=" + DATA_BRANCH + "&t=" + Date.now(), { headers: hdr(), cache: "no-store" });
    if (r.status === 404) { dataSha = null; return { explain: {}, notes: {} }; }
    if (!r.ok) throw new Error("GitHub " + r.status);
    const j = await r.json(); dataSha = j.sha;
    const d = JSON.parse(new TextDecoder().decode(await decryptBytes(b64.dec(j.content.replace(/\s/g, "")))));
    return { explain: d.explain || {}, notes: d.notes || {} };
  }
  async function refresh() {
    try {
      const d = await pull(); S.explain = d.explain; S.notes = d.notes;
      S.db = tok() && desktopMQ.matches ? true : null;
      $("ghsum").textContent = tok() ? "编辑设置" : "✏️ 开启在线编辑"; if (tok()) { $("ghbox").classList.remove("need"); $("ghmsg").hidden = true; }
      setSync(true, S.db ? "已同步 · 可编辑" : (tok() ? "已同步" : "已同步 · 只读"));
      const a = document.activeElement; if (!(S.editing || (a && a.tagName === "TEXTAREA"))) render();
    } catch (e) { setSync(false, "笔记没载入：" + e.message); }
  }
  async function initDb() {
    $("ghtok").value = tok();
    $("ghsave").onclick = () => { ls.set("st-gh", $("ghtok").value.trim() || null); refresh(); };
    $("ghclear").onclick = () => { ls.set("st-gh", null); $("ghtok").value = ""; refresh(); };
    $("lockout").onclick = () => { ls.set("st-key", null); location.reload(); };
    await refresh();
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
    setInterval(() => { if (!document.hidden) refresh(); }, 120000);
  }
  function write(col, key, data) {
    const job = async () => {
      if (!tok()) { needEdit(); return false; }
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const cur = await pull();
          if (data == null) delete cur[col][key]; else cur[col][key] = data;
          const body = { message: (data == null ? "reset " : "save ") + col + " " + key, branch: DATA_BRANCH,
            content: b64.enc(await encryptBytes(new TextEncoder().encode(JSON.stringify(cur)))) };
          if (dataSha) body.sha = dataSha;
          const r = await fetch(API, { method: "PUT", headers: Object.assign(hdr(), { "Content-Type": "application/json" }), body: JSON.stringify(body) });
          if (r.status === 409 || r.status === 422) continue;
          if (!r.ok) { setSync(false, r.status === 401 || r.status === 403 ? "令牌无效或没有写权限" : "保存失败 " + r.status); return false; }
          dataSha = (await r.json()).content.sha; S.explain = cur.explain; S.notes = cur.notes; setSync(true, "已同步 · 可编辑");
          return true;
        } catch (e) { setSync(false, "保存失败：" + e.message); }
      }
      return false;
    };
    const p = queue.then(job, job); queue = p.catch(() => {}); return p;
  }
  async function saveDoc(col, key, data) { return write(col, key, data); }
  async function deleteDoc(col, key) { await write(col, key, null); }

  // ---------- PDF ----------
  let cmapsP = null;
  class CMapFactory {
    constructor() {}
    async fetch({ name }) {
      cmapsP = cmapsP || fetch("cmaps.json").then(r => r.json());
      const all = await cmapsP;
      if (!all[name]) throw new Error("缺少字符映射 " + name);
      const bin = atob(all[name]), u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      return { cMapData: u, compressionType: 1 };
    }
  }
  let observer = null, pageObs = null;
  async function loadPdf(file) {
    const token = ++S.loadToken; const pages = $("pages");
    if (!file) { pages.innerHTML = '<p class="muted">这一天没有要截取的资料。</p>'; $("vt").textContent = "资料合集"; $("vp").textContent = ""; S.pdf = null; S.pdfFile = null; return; }
    if (S.pdfFile === file && S.pdf) return;
    pages.innerHTML = '<p class="muted">正在载入资料……</p>';
    let pdf;
    try { pdf = await pdfjsLib.getDocument({ data: await getEnc(file), cMapUrl: "cmaps/", cMapPacked: true, CMapReaderFactory: CMapFactory }).promise; }
    catch (e) { if (token === S.loadToken) pages.innerHTML = '<p class="muted">资料 PDF 打不开：' + esc(e.message) + "</p>"; return; }
    if (token !== S.loadToken) return;
    S.pdf = pdf; S.pdfFile = file; pages.innerHTML = ""; S.pageBoxes = [];
    const starts = {}; (S.manifest.find(m => m.file === file) || { sections: [] }).sections.forEach(s => starts[s.page] = s.title);
    const base = (await pdf.getPage(1)).getViewport({ scale: 1 });
    if (observer) observer.disconnect(); if (pageObs) pageObs.disconnect();
    observer = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { observer.unobserve(en.target); renderPage(pdf, en.target, token); } }), { root: pages, rootMargin: "900px 0px" });
    pageObs = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) $("vp").textContent = en.target.dataset.n + " / " + pdf.numPages; }), { root: pages, threshold: 0.5 });
    for (let i = 1; i <= pdf.numPages; i++) {
      if (starts[i]) { const s = document.createElement("div"); s.className = "psec"; s.textContent = starts[i]; pages.appendChild(s); }
      const box = document.createElement("div"); box.className = "page"; box.dataset.n = i; box.style.aspectRatio = base.width + " / " + base.height;
      box.innerHTML = '<span class="no">' + i + "</span>";
      pages.appendChild(box); S.pageBoxes[i] = box; observer.observe(box); pageObs.observe(box);
    }
    placeNotes();
    $("vt").textContent = "资料合集 · " + md(S.date) + " " + wd(S.date);
    $("vp").textContent = "1 / " + pdf.numPages;
  }
  async function renderPage(pdf, box, token) {
    try {
      const page = await pdf.getPage(+box.dataset.n); if (token !== S.loadToken) return;
      const vp1 = page.getViewport({ scale: 1 }); box.style.aspectRatio = vp1.width + " / " + vp1.height;
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      const vp = page.getViewport({ scale: (box.clientWidth || 700) * ratio / vp1.width });
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      box.insertBefore(c, box.firstChild);
    } catch (e) {}
  }
  function showSection(it, i, cardEl) {
    const s = it.sections[i];
    document.querySelectorAll(".card.active").forEach(c => c.classList.remove("active"));
    cardEl.classList.add("active");
    $("viewer").classList.add("open");
    $("vt").textContent = it.course + " " + it.kind + " · " + s.title.split(" · ").slice(1).join(" · ");
    let tries = 0;
    const go = () => {
      const box = S.pageBoxes[s.page];
      if (box) { const prev = box.previousElementSibling; const t = prev && prev.classList.contains("psec") ? prev : box; $("pages").scrollTop = t.offsetTop - 8; }
      else if (tries++ < 50) setTimeout(go, 200);
    };
    go();
  }
  $("vclose").addEventListener("click", () => $("viewer").classList.remove("open"));
  if (desktopMQ.addEventListener) desktopMQ.addEventListener("change", () => { S.editing = null; render(); });

  function start() {
    $("lock").hidden = true;
    loadManifest().catch(() => { $("cards").innerHTML = '<div class="empty">资料目录没有载入，刷新一下试试。</div>'; });
    initDb();
  }
  $("lockf").addEventListener("submit", async ev => {
    ev.preventDefault(); $("pwerr").textContent = ""; $("pwbtn").disabled = true; $("pwbtn").textContent = "解锁中……";
    let ok = false; try { ok = await unlockWith($("pw").value); } catch (e) { $("pwerr").textContent = "出错了：" + e.message; }
    $("pwbtn").disabled = false; $("pwbtn").textContent = "打开";
    if (ok) start(); else if (!$("pwerr").textContent) $("pwerr").textContent = "密码不对";
  });
  (async () => {
    const saved = ls.get("st-key");
    if (saved) { try { if (await tryKey(await importRaw(b64.dec(saved)))) return start(); } catch (e) {} ls.set("st-key", null); }
    $("pw").focus();
  })();
})();
</script>
</body>
</html>
