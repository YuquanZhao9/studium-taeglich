<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="看课">
<title>看课播放器</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { --bg: #f6f7fa; --card: #ffffff; --ink: #2f3342; --muted: #8a8fa0; --line: #e4e7ee;
  --accent: #6474d2; --accent-soft: #edf0fc; --bad: #d8584f; --on-accent: #ffffff;
  --c-AM: #3b6fd1; --c-SASP: #2f8a4e; --c-MC: #b9800f; --c-ITCL: #8a55c9; --c-AR: #d8584f; --c-ARC: #d8584f; --c-AT2: #0f8a7e; --c-DEMO: #6b7280;
  --ui: "IBM Plex Sans", -apple-system, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --pink: #fb7299; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111217; --card: #1c1d24; --ink: #e8e9ef; --muted: #8e93a4; --line: #2a2c36;
  --accent: #8b98e8; --accent-soft: #262a45; --bad: #f07a7d; --on-accent: #111217;
  --c-AM: #7aa2f2; --c-SASP: #6cc48d; --c-MC: #e3b34a; --c-ITCL: #b892ec; --c-AR: #f07a7d; --c-ARC: #f07a7d; --c-AT2: #4fc4b5; --c-DEMO: #a3a8b6; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111217; --card: #1c1d24; --ink: #e8e9ef; --muted: #8e93a4; --line: #2a2c36;
  --accent: #8b98e8; --accent-soft: #262a45; --bad: #f07a7d; --on-accent: #111217;
  --c-AM: #7aa2f2; --c-SASP: #6cc48d; --c-MC: #e3b34a; --c-ITCL: #b892ec; --c-AR: #f07a7d; --c-ARC: #f07a7d; --c-AT2: #4fc4b5; --c-DEMO: #a3a8b6; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--ui); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }

/* lock */
.lock { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: var(--bg); }
.lock form { width: min(360px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px 22px; display: grid; gap: 14px; }
.lock h1 { margin: 0; font-size: 20px; }
.lock p { margin: 0; color: var(--muted); font-size: 13px; }
.lock input { font: 16px var(--mono); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
.lock .err { color: var(--bad); min-height: 1.2em; font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 14px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

/* page */
.top { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--card); padding-top: max(10px, env(safe-area-inset-top)); }
.top h1 { font-size: 16px; margin: 0; flex: 1; }
.top a { font-size: 13px; text-decoration: none; }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; max-width: 1500px; margin: 0 auto; padding: 20px; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.meta h2 { margin: 12px 0 2px; font-size: 18px; line-height: 1.4; }
.meta .sub { color: var(--muted); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.meta .sub button { border: none; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tools label.btn { display: inline-flex; align-items: center; gap: 6px; }
.tools input[type=file] { display: none; }
.keys { margin-top: 14px; color: var(--muted); font-size: 12.5px; }
.keys kbd { font: 11.5px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--card); color: var(--ink); }
.keys span { margin-right: 12px; white-space: nowrap; display: inline-block; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--cc, var(--muted)); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.list .lh { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.list .lh b { color: var(--ink); font-size: 14px; }
.list .lh label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.list ol { list-style: none; margin: 0; padding: 4px 0; max-height: calc(100vh - 300px); overflow-y: auto; }
.list li { display: flex; align-items: stretch; }
.list li > button.dl { flex: none; width: auto; min-width: 46px; display: grid; place-items: center; padding: 0 12px; color: var(--muted); font: 12px var(--mono); }
.list li > button.dl.have { color: #2f8a4e; font-size: 15px; }
.list li > button.dl.busy { color: var(--accent); }
.list .off { padding: 6px 14px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
.list .off:empty { display: none; }
.list li button { width: 100%; text-align: left; border: none; background: none; padding: 9px 14px; cursor: pointer; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 8px; align-items: start; }
.list li button:hover { background: var(--accent-soft); }
.list li.on button { background: var(--accent-soft); }
.list li.on .t { color: var(--accent); font-weight: 600; }
.list .n { font: 12px var(--mono); color: var(--muted); padding-top: 2px; }
.list .t { font-size: 14px; line-height: 1.4; }
.list .d { grid-column: 2; font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.list .pg { flex: 1; max-width: 90px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.list .pg i { display: block; height: 100%; background: var(--pink); }
.list .done { color: #2f8a4e; }
.list .none { padding: 18px 14px; color: var(--muted); font-size: 13px; }
.list .miss .t { color: var(--muted); }

/* player */
.player { position: relative; background: #000; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; color: #fff; }
.player video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
.player video::cue { font-family: var(--ui); background: rgba(0,0,0,.55); font-size: clamp(14px, 2.4vw, 26px); }
.player .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #c9ccd6; font-size: 14px; padding: 20px; }
.player .hit { position: absolute; inset: 0; -webkit-touch-callout: none; }
.player .big { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: rgba(0,0,0,.45); display: grid; place-items: center; cursor: pointer; transition: opacity .2s; }
.player.idle .big.pz { opacity: 0; pointer-events: none; }
.player .spin { position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; margin: -19px 0 0 -19px; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: sp 0.9s linear infinite; pointer-events: none; }
@keyframes sp { to { transform: rotate(360deg); } }
.player .toast { position: absolute; z-index: 3; left: 14px; bottom: 64px; background: rgba(20,20,24,.82); border-radius: 6px; padding: 7px 12px; font-size: 13px; pointer-events: auto; display: flex; gap: 10px; align-items: center; max-width: calc(100% - 28px); }
.player .toast button { background: none; border: none; color: var(--pink); cursor: pointer; padding: 0; font-size: 13px; }
.player .center { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); background: rgba(20,20,24,.78); border-radius: 8px; padding: 8px 16px; font: 600 15px var(--ui); pointer-events: none; white-space: nowrap; }
.player .ripple { position: absolute; top: 0; bottom: 0; width: 34%; display: grid; place-items: center; pointer-events: none; font: 600 14px var(--ui); }
.player .ripple.l { left: 0; background: radial-gradient(ellipse at left, rgba(255,255,255,.18), transparent 70%); }
.player .ripple.r { right: 0; background: radial-gradient(ellipse at right, rgba(255,255,255,.18), transparent 70%); }
.player .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 12px 6px; background: linear-gradient(transparent, rgba(0,0,0,.72)); transition: opacity .25s; }
.player.idle .bar, .player.idle .ttl { opacity: 0; pointer-events: none; }
.player.idle { cursor: none; }
.player .ttl { position: absolute; left: 0; right: 0; top: 0; padding: 10px 14px 24px; background: linear-gradient(rgba(0,0,0,.6), transparent); font-size: 14px; transition: opacity .25s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; display: none; }
.player.fs .ttl, .player.wfs .ttl, .player.pfs .ttl { display: block; }
.prog { position: relative; height: 16px; cursor: pointer; touch-action: none; }
.prog .rail { position: absolute; left: 0; right: 0; top: 6px; height: 4px; background: rgba(255,255,255,.25); border-radius: 2px; transition: height .12s, top .12s; }
.prog:hover .rail, .prog.drag .rail { top: 5px; height: 6px; }
.prog .buf, .prog .done { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
.prog .buf { background: rgba(255,255,255,.4); }
.prog .done { background: var(--pink); }
.prog .knob { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(251,114,153,.45); transform: scale(0); transition: transform .12s; }
.prog:hover .knob, .prog.drag .knob { transform: scale(1); }
.prog .mk { position: absolute; top: -1px; width: 4px; height: 8px; margin-left: -2px; border-radius: 1px; background: #ffd34d; box-shadow: 0 0 0 1px rgba(0,0,0,.35); pointer-events: none; }
.prog:hover .mk, .prog.drag .mk { top: 0; }
.marks { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.marks .mh { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
.marks .mh b { color: var(--ink); font-size: 14px; }
.marks ul { list-style: none; margin: 0; padding: 4px 0; max-height: 260px; overflow-y: auto; }
.marks li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 4px 8px 4px 14px; }
.marks li:hover { background: var(--accent-soft); }
.marks .tm { font: 13px var(--mono); color: var(--accent); background: none; border: none; cursor: pointer; padding: 2px 0; }
.marks .nt { font-size: 14px; cursor: pointer; overflow-wrap: anywhere; }
.marks .nt.empty { color: var(--muted); font-size: 13px; }
.marks .x { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 4px 6px; border-radius: 6px; }
.marks .x:hover { color: var(--ink); background: var(--line); }
.marks .syncst { padding: 4px 14px 0; font-size: 12px; color: var(--muted); }
.marks .syncst:empty { display: none; }
.marks .none { padding: 10px 14px; color: var(--muted); font-size: 13px; }
.prog .tip { position: absolute; bottom: 20px; transform: translateX(-50%); background: rgba(20,20,24,.85); border-radius: 4px; padding: 2px 6px; font: 12px var(--mono); pointer-events: none; white-space: nowrap; }
.ctr { display: flex; align-items: center; gap: 4px; height: 38px; }
.ctr .sp { flex: 1; }
.ib { background: none; border: none; color: #fff; height: 36px; min-width: 36px; padding: 0 6px; display: inline-grid; place-items: center; cursor: pointer; border-radius: 6px; opacity: .92; font-size: 13.5px; }
.ib:hover { opacity: 1; background: rgba(255,255,255,.1); }
.ib svg { width: 22px; height: 22px; fill: currentColor; }
.ib.on { color: var(--pink); }
.time { font: 13px var(--mono); padding: 0 6px; white-space: nowrap; }
.pop { position: relative; }
.menu { position: absolute; bottom: 42px; left: 50%; transform: translateX(-50%); background: rgba(24,24,28,.94); border-radius: 8px; padding: 6px 0; min-width: 84px; display: none; }
.menu button { display: block; width: 100%; background: none; border: none; color: #fff; padding: 6px 16px; cursor: pointer; font-size: 13.5px; white-space: nowrap; }
.menu button:hover { background: rgba(255,255,255,.1); }
.menu button.on { color: var(--pink); font-weight: 600; }
.pop.open .menu { display: block; }
@media (hover: hover) { .pop:hover .menu { display: block; } .pop::after { content: ""; position: absolute; left: 0; right: 0; bottom: 36px; height: 10px; } }
.vol { display: flex; align-items: center; }
.vol input { width: 0; opacity: 0; transition: width .2s, opacity .2s; accent-color: var(--pink); }
.vol:hover input, .vol input:focus { width: 80px; opacity: 1; }
.player.wfs { position: fixed; inset: 0; z-index: 40; border-radius: 0; aspect-ratio: auto; }
.player:fullscreen { border-radius: 0; aspect-ratio: auto; }
.player:-webkit-full-screen { border-radius: 0; width: 100%; height: 100%; }
/* phone fullscreen without the system player (iPhone): fills the screen, turned sideways while the phone is held upright */
.player.pfs { position: fixed; z-index: 50; left: 50%; top: 50%; width: 100vw; height: 100vh; height: 100dvh; transform: translate(-50%, -50%); border-radius: 0; aspect-ratio: auto; }
.player.pfs.rot { width: 100vh; width: 100dvh; height: 100vw; transform: translate(-50%, -50%) rotate(90deg); }
.player.pfs .hit { touch-action: none; }
.player.pfs.rot .bar { padding-left: max(12px, env(safe-area-inset-top)); padding-right: max(12px, env(safe-area-inset-bottom)); }
.player.pfs:not(.rot) .bar { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
html.noscroll, html.noscroll body { overflow: hidden; }

/* phone */
@media (max-width: 899px) {
  .top { padding: 8px 14px; padding-top: max(8px, env(safe-area-inset-top)); }
  .wrap { grid-template-columns: 1fr; gap: 0; padding: 0; }
  .main { position: sticky; top: 0; z-index: 5; background: var(--bg); }
  .player { border-radius: 0; }
  .meta { padding: 0 16px 10px; }
  .meta h2 { font-size: 16px; margin-top: 10px; }
  .keys, .hide-m { display: none !important; }
  .side { padding: 4px 16px 24px; }
  .chips { flex-wrap: nowrap; }
  .list ol { max-height: none; }
  .marks { margin-top: 10px; }
  .marks ul { max-height: 132px; }
  .ib { min-width: 34px; padding: 0 4px; }
  .time { font-size: 12px; padding: 0 2px; }
  .player .bar { padding: 22px 6px 2px; }
}
@media (max-width: 899px) and (orientation: landscape) { .main { position: static; } }
</style>
</head>
<body>

<div class="lock" id="lock" hidden>
  <form id="lockf" autocomplete="on">
    <h1>看课播放器</h1>
    <p>和学习页用同一个密码。在学习页解锁过的设备会自动进来。</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="密码" required>
    <button class="btn pri" type="submit" id="pwb">进入</button>
    <div class="err" id="pwerr"></div>
  </form>
</div>

<header class="top">
  <h1>看课播放器</h1>
  <a href="../">← 学习页</a>
</header>

<div class="wrap">
  <section class="main">
    <div class="player" id="pl" tabindex="0">
      <video id="v" playsinline webkit-playsinline preload="metadata"></video>
      <div class="empty" id="empty">从右边（手机：下面）选一节课开始看</div>
      <div class="hit" id="hit"></div>
      <div class="ttl" id="ttl"></div>
      <div class="big" id="big" hidden><svg viewBox="0 0 24 24" width="30" height="30" fill="#fff"><path id="ibig" d="M8 5.5v13l11-6.5z"/></svg></div>
      <div class="spin" id="spin" hidden></div>
      <div class="ripple l" id="rl" hidden></div>
      <div class="ripple r" id="rr" hidden></div>
      <div class="center" id="center" hidden></div>
      <div class="toast" id="toast" hidden></div>
      <div class="bar" id="bar">
        <div class="prog" id="prog">
          <div class="rail"><div class="buf" id="buf"></div><div class="done" id="done"></div><div id="mks"></div><div class="knob" id="knob"></div></div>
          <div class="tip" id="tip" hidden></div>
        </div>
        <div class="ctr">
          <button class="ib" id="bplay" title="播放/暂停 (空格)"><svg viewBox="0 0 24 24"><path id="iplay" d="M8 5.5v13l11-6.5z"/></svg></button>
          <button class="ib hide-m" id="bnext" title="下一节"><svg viewBox="0 0 24 24"><path d="M6 6v12l8.5-6zM16 6h2v12h-2z"/></svg></button>
          <span class="time"><span id="tcur">0:00</span> / <span id="tdur">0:00</span></span>
          <span class="sp"></span>
          <div class="pop" id="ratepop"><button class="ib" id="brate" title="倍速 ([ ])">倍速</button><div class="menu" id="ratemenu"></div></div>
          <button class="ib" id="bmark" title="标记当前时间 (B)"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4zm2 2v12.2l4-2.7 4 2.7V5z"/></svg></button>
          <button class="ib" id="bsub" title="字幕 (C)" hidden>字幕</button>
          <div class="vol hide-m"><button class="ib" id="bmute" title="静音 (M)"><svg viewBox="0 0 24 24"><path id="ivol" d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button><input type="range" id="vol" min="0" max="1" step="0.05" aria-label="音量"></div>
          <button class="ib" id="bpip" title="小窗" hidden><svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8zm2-4H3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H3V5h18z"/></svg></button>
          <button class="ib hide-m" id="bwfs" title="网页全屏 (W)"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zm2 2v10h14V7zm2 2h4v2H9v2H7zm10 6h-4v-2h2v-2h2z"/></svg></button>
          <button class="ib" id="bfs" title="全屏 (F)"><svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 3v-3h2v5h-5v-2z"/></svg></button>
        </div>
      </div>
    </div>
    <div class="meta">
      <h2 id="title">还没有选课</h2>
      <div class="sub" id="sub"></div>
      <div class="tools">
        <label class="btn">打开本地视频<input type="file" id="fvid" accept="video/*,.mkv,.mov,.m4v"></label>
        <label class="btn">加载字幕<input type="file" id="fsub" accept=".vtt,.srt"></label>
        <button class="btn" type="button" id="bpc">设置电脑地址</button>
      </div>
      <div class="marks" id="marks" hidden>
        <div class="mh"><b>我的标记</b><span>点时间跳过去，点文字改备注</span></div>
        <div class="syncst" id="syncst"></div>
        <ul id="mlist"></ul>
      </div>
      <div class="keys">
        <span><kbd>空格</kbd> 播放/暂停</span><span><kbd>←</kbd><kbd>→</kbd> 5 秒</span><span>长按 <kbd>→</kbd> 3 倍速</span>
        <span><kbd>[</kbd><kbd>]</kbd> 倍速</span><span><kbd>↑</kbd><kbd>↓</kbd> 音量</span><span><kbd>F</kbd> 全屏</span><span><kbd>W</kbd> 网页全屏</span>
        <span><kbd>M</kbd> 静音</span><span><kbd>C</kbd> 字幕</span><span><kbd>N</kbd> 下一节</span><span><kbd>B</kbd> 标记</span><span><kbd>0</kbd>–<kbd>9</kbd> 跳到 0–90%</span>
      </div>
    </div>
  </section>

  <aside class="side">
    <div class="chips" id="chips"></div>
    <div class="list">
      <div class="lh"><b id="ltitle"></b><label><input type="checkbox" id="auto"> 自动连播</label></div>
      <div class="off" id="offinfo"></div>
      <ol id="items"></ol>
    </div>
  </aside>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  }
  function renderMarks() {
    const a = getMarks(), ul = $("mlist"), d = v.duration;
    $("marks").hidden = !curKey(); ul.innerHTML = "";
    $("mks").innerHTML = d ? a.map(m => "<i class='mk' style='left:" + (m.t / d * 100) + "%'></i>").join("") : "";
    if (!a.length) { ul.innerHTML = "<li class='none'>还没有标记。播放时点进度条右边的书签按钮（或按 B）就能记下当前时间。</li>"; return; }
    a.forEach((m, i) => {
      const li = document.createElement("li");
      li.innerHTML = "<button class='tm' type='button'>" + fmt(m.t) + "</button><span class='nt" + (m.note ? "" : " empty") + "'>" + esc(m.note || "加备注") + "</span><button class='x' type='button' title='改备注'>✎</button><button class='x' type='button' title='删除'>✕</button>";
      const [tm, nt, ed, del] = li.children;
      tm.onclick = () => { v.currentTime = m.t; if (v.paused) v.play().catch(() => {}); };
      nt.onclick = ed.onclick = () => editMark(i);
      del.onclick = () => { const b = getMarks(); b.splice(i, 1); putMarks(b); };
      ul.appendChild(li);
    });
  }
  function editMark(i) {
    const a = getMarks(); if (!a[i]) return;
    const n = prompt("备注（" + fmt(a[i].t) + "）", a[i].note || "");
    if (n == null) return; a[i].note = n.trim(); putMarks(a);
  }
  function addMark() {
    if (!curKey() || !v.duration) return;
    const t = Math.round(v.currentTime * 10) / 10, a = getMarks();
    if (a.some(m => Math.abs(m.t - t) < 2)) { center("这里已经标记过了"); return; }
    a.push({ t, note: "", at: Date.now() }); putMarks(a);
    const i = getMarks().findIndex(m => m.t === t);
    toast("已标记 " + fmt(t), "加备注", () => editMark(i));
  }
  $("bmark").onclick = e => { e.stopPropagation(); addMark(); };
  v.addEventListener("durationchange", renderMarks);
  // pointer position inside an element, in the player's own frame (the player may be turned 90° in phone fullscreen)
  function loc(e, el) { const r = el.getBoundingClientRect(); return pl.classList.contains("rot") ? { x: e.clientY - r.top, y: r.right - e.clientX, w: r.height } : { x: e.clientX - r.left, y: e.clientY - r.top, w: r.width }; }
  const frac = e => { const p = loc(e, prog); return Math.min(1, Math.max(0, p.x / p.w)); };
  function tipAt(e) { const f = frac(e), t = $("tip"); t.hidden = !v.duration; t.textContent = fmt(f * v.duration); const mk = getMarks().find(m => Math.abs(m.t / v.duration - f) < 0.006); if (mk) t.textContent += mk.note ? "  ★ " + mk.note : "  ★"; t.style.left = Math.min(Math.max(f * 100, 4), 96) + "%"; }
  let dragging = false;
  prog.addEventListener("pointerdown", e => { if (!v.duration) return; dragging = true; prog.classList.add("drag"); prog.setPointerCapture(e.pointerId); v.currentTime = frac(e) * v.duration; tipAt(e); e.stopPropagation(); });
  prog.addEventListener("pointermove", e => { tipAt(e); if (dragging) { v.currentTime = frac(e) * v.duration; poke(); } });
  const endDrag = () => { dragging = false; prog.classList.remove("drag"); $("tip").hidden = true; };
  prog.addEventListener("pointerup", endDrag); prog.addEventListener("pointercancel", endDrag);
  prog.addEventListener("pointerleave", () => { if (!dragging) $("tip").hidden = true; });

  // ---------- overlays ----------
  let idleT = 0;
  function poke() { pl.classList.remove("idle"); clearTimeout(idleT); if (!v.paused) idleT = setTimeout(() => { if (!$("ratepop").classList.contains("open") && !dragging) pl.classList.add("idle"); }, 2800); }
  pl.addEventListener("mousemove", poke);
  let centerT = 0;
  function center(s) { const c = $("center"); c.textContent = s; c.hidden = false; clearTimeout(centerT); centerT = setTimeout(() => c.hidden = true, 900); }
  let toastT = 0;
  function toast(s, btn, fn) {
    const t = $("toast"); t.innerHTML = "<span>" + esc(s) + "</span>"; t.hidden = false;
    if (btn) { const b = document.createElement("button"); b.textContent = btn; b.onclick = e => { e.stopPropagation(); fn(); t.hidden = true; }; t.appendChild(b); }
    clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 5000);
  }
  function ripple(side, s) { const r = $(side < 0 ? "rl" : "rr"); r.textContent = s; r.hidden = false; clearTimeout(r._t); r._t = setTimeout(() => r.hidden = true, 500); }

  // ---------- fast-forward hold (2x while held) ----------
  let holding = false, holdRate = 1;
  function holdOn() { if (holding || !v.src) return; holding = true; holdRate = v.playbackRate; v.playbackRate = 2; if (v.paused) v.play().catch(() => {}); const c = $("center"); c.textContent = "▶▶ 2x 倍速中"; c.hidden = false; clearTimeout(centerT); }
  function holdOff() { if (!holding) return; holding = false; v.playbackRate = holdRate; $("center").hidden = true; }

  // ---------- pointer on video: mouse click / touch gestures ----------
  const hit = $("hit");
  let tapT = 0, lastTap = 0, lpT = 0, sx = 0, sy = 0, st = 0, swiping = false, moved = false, chain = 0, chainT = 0;
  hit.addEventListener("pointerdown", e => {
    const p = loc(e, hit); sx = p.x; sy = p.y; st = v.currentTime; swiping = false; moved = false;
    if (e.pointerType !== "mouse") { lpT = setTimeout(() => { if (!moved) holdOn(); }, 450); }
    else if (e.button === 2) lpT = setTimeout(holdOn, 250); // hold the right mouse button = 2x
  });
  hit.addEventListener("pointermove", e => {
    if (e.pointerType === "mouse") return;
    const p = loc(e, hit), dx = p.x - sx, dy = p.y - sy;
    if (Math.abs(dx) > 12 || Math.abs(dy) > 12) { moved = true; clearTimeout(lpT); }
    if (!holding && v.duration && (swiping || (Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy) * 1.5))) {
      swiping = true; const w = p.w;
      const t = Math.min(v.duration, Math.max(0, st + dx / w * Math.min(v.duration, 600)));
      const c = $("center"); c.textContent = fmt(t) + " / " + fmt(v.duration) + "  (" + (t >= st ? "+" : "−") + fmt(Math.abs(t - st)) + ")"; c.hidden = false; clearTimeout(centerT);
      hit._target = t;
    }
  });
  hit.addEventListener("pointerup", e => {
    clearTimeout(lpT);
    if (holding) { holdOff(); return; }
    if (e.pointerType === "mouse" && e.button === 2) return;
    if (swiping) { swiping = false; v.currentTime = hit._target; $("center").hidden = true; return; }
    if (moved) return;
    if (e.pointerType === "mouse") {
      // single click = play/pause, double click = fullscreen (like Bilibili)
      const now = Date.now();
      if (now - lastTap < 280) { clearTimeout(tapT); lastTap = 0; toggleFs(); return; }
      lastTap = now; tapT = setTimeout(toggle, 220); return;
    }
    const p = loc(e, hit), x = p.x / p.w, now = Date.now();
    const side = x < 0.33 ? -1 : x > 0.67 ? 1 : 0;
    if (now - lastTap < 300 || (chain && now - chainT < 600 && side)) {
      clearTimeout(tapT); lastTap = 0;
      if (side) { seek(side * 10); chain = side === Math.sign(chain) ? chain + side : side; chainT = now; ripple(side, (side < 0 ? "« " : "") + Math.abs(chain) * 10 + " 秒" + (side > 0 ? " »" : "")); }
      else toggle();
      return;
    }
    chain = 0; lastTap = now;
    tapT = setTimeout(() => { pl.classList.contains("idle") || v.paused ? poke() : pl.classList.add("idle"); }, 300);
  });
  hit.addEventListener("pointercancel", () => { clearTimeout(lpT); holdOff(); swiping = false; });
  hit.addEventListener("contextmenu", e => e.preventDefault());
  pl.addEventListener("touchstart", () => poke(), { passive: true });

  // ---------- fullscreen ----------
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const canFs = !!(pl.requestFullscreen || pl.webkitRequestFullscreen);
  // iPhone has no element fullscreen (only the system player, where our gestures don't work), so fake it
  function fitRot() { pl.classList.toggle("rot", pl.classList.contains("pfs") && innerHeight > innerWidth); }
  function pseudoFs(on) {
    // FLIP: remember where the player is, switch, then animate from there (grow + turn, like Bilibili)
    const a = pl.getBoundingClientRect(), wasRot = pl.classList.contains("rot");
    pl.classList.toggle("pfs", on); document.documentElement.classList.toggle("noscroll", on);
    $("bfs").classList.toggle("on", on); fitRot(); poke();
    const b = pl.getBoundingClientRect(), isRot = pl.classList.contains("rot"), W = pl.offsetWidth, H = pl.offsetHeight;
    if (!pl.animate || !W || !H || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const aw = wasRot ? a.height : a.width, ah = wasRot ? a.width : a.height;
    const dx = a.left + a.width / 2 - (b.left + b.width / 2), dy = a.top + a.height / 2 - (b.top + b.height / 2);
    const pre = on ? "translate(-50%, -50%) " : "";
    pl.animate([
      { transform: pre + "translate(" + dx + "px, " + dy + "px) rotate(" + (wasRot ? 90 : 0) + "deg) scale(" + aw / W + ", " + ah / H + ")" },
      { transform: pre + "translate(0px, 0px) rotate(" + (isRot ? 90 : 0) + "deg) scale(1, 1)" }
    ], { duration: 320, easing: "cubic-bezier(.2, .8, .2, 1)" });
  }
  addEventListener("resize", fitRot);
  function toggleFs() {
    if (pl.classList.contains("pfs")) { pseudoFs(false); return; }
    if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    if (!canFs && coarse) { if (pl.classList.contains("wfs")) toggleWfs(); pseudoFs(true); return; }
    if (canFs) {
      const p = (pl.requestFullscreen || pl.webkitRequestFullscreen).call(pl);
      if (p && p.then) p.then(() => { if (v.videoWidth > v.videoHeight && screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {}); }).catch(() => {});
    } else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen(); // iPhone: native player
  }
  ["fullscreenchange", "webkitfullscreenchange"].forEach(e => document.addEventListener(e, () => { pl.classList.toggle("fs", !!fsEl()); if (!fsEl() && screen.orientation && screen.orientation.unlock) try { screen.orientation.unlock(); } catch (x) {} }));
  $("bfs").onclick = toggleFs;
  const toggleWfs = () => { pl.classList.toggle("wfs"); $("bwfs").classList.toggle("on", pl.classList.contains("wfs")); };
  $("bwfs").onclick = toggleWfs;
  if (document.pictureInPictureEnabled || v.webkitSupportsPresentationMode) {
    $("bpip").hidden = false;
    $("bpip").onclick = () => { if (document.pictureInPictureElement) document.exitPictureInPicture(); else if (v.requestPictureInPicture) v.requestPictureInPicture().catch(() => {}); else v.webkitSetPresentationMode("picture-in-picture"); };
  }

  // ---------- subtitles ----------
  // subtitles saved next to a recording on the PC (same name .vtt/.srt), served with CORS by sync_server.py
  async function loadSideSubs(it) {
    try {
      const r = await fetch(pcBase() + "/sync/sub/" + it.path.split("/").map(encodeURIComponent).join("/"), { cache: "no-cache" });
      if (r.ok && S.item === it) addTrack(await r.text(), true);
    } catch (e) {}
  }
  function srt2vtt(s) { return "WEBVTT\n\n" + s.replace(/\r/g, "").replace(/(\d\d:\d\d:\d\d),(\d\d\d)/g, "$1.$2").replace(/^\d+\n(?=\d\d:)/gm, ""); }
  function addTrack(src, isText) {
    [...v.querySelectorAll("track")].forEach(t => t.remove());
    const url = isText ? URL.createObjectURL(new Blob([src], { type: "text/vtt" })) : src;
    if (isText) S.subUrl = url;
    const t = document.createElement("track"); t.kind = "subtitles"; t.label = "字幕"; t.srclang = "zh"; t.src = url; t.default = true; v.appendChild(t);
    // burned-in subtitles (item.burned): keep the side track as an option, off by default
    const show = S.subOn && !(S.item && S.item.burned);
    t.addEventListener("load", () => { const tt = v.textTracks[0]; tt.mode = show ? "showing" : "hidden"; [...(tt.cues || [])].forEach(c => { c.snapToLines = true; c.line = -3; }); });
    $("bsub").hidden = false; $("bsub").classList.toggle("on", show);
  }
  $("bsub").onclick = () => {
    const on = !$("bsub").classList.contains("on");
    if (!(S.item && S.item.burned)) S.subOn = on;
    [...v.textTracks].forEach(t => t.mode = on ? "showing" : "hidden"); $("bsub").classList.toggle("on", on); center(on ? "字幕开" : "字幕关");
  };
  $("fsub").onchange = async e => { const f = e.target.files[0]; if (!f) return; const s = await f.text(); addTrack(/^WEBVTT/.test(s) ? s : srt2vtt(s), true); e.target.value = ""; center("字幕已加载"); };
  $("fvid").onchange = e => {
    const f = e.target.files[0], tag = e.target.dataset.for; e.target.dataset.for = ""; e.target.value = "";
    if (!f) return;
    if (tag) { const [cid, iid] = tag.split("|"); const co = S.lib.courses.find(c => c.id === cid), it = co && co.items.find(i => i.id === iid); if (it) return openItem(co, it, true, f); }
    openLocal(f);
  };
  // drag & drop a file onto the page (desktop)
  addEventListener("dragover", e => e.preventDefault());
  addEventListener("drop", async e => { e.preventDefault(); for (const f of e.dataTransfer.files) { if (/\.(srt|vtt)$/i.test(f.name)) { const s = await f.text(); addTrack(/^WEBVTT/.test(s) ? s : srt2vtt(s), true); } else if (/^video\//.test(f.type) || /\.(mkv|mp4|mov|m4v|webm)$/i.test(f.name)) openLocal(f); } });

  // ---------- keyboard ----------
  let rightDown = 0, rightHoldT = 0;
  addEventListener("keydown", e => {
    if (e.target.matches("input[type=password], input[type=text], textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === "ArrowRight") { e.preventDefault(); if (!rightDown) { rightDown = Date.now(); rightHoldT = setTimeout(holdOn, 400); } return; }
    const map = {
      " ": toggle, k: toggle, ArrowLeft: () => { seek(-5); center("« 5 秒"); }, ArrowUp: () => stepVol(0.05), ArrowDown: () => stepVol(-0.05),
      f: toggleFs, w: toggleWfs, m: () => { v.muted = !v.muted; center(v.muted ? "已静音" : "取消静音"); }, "[": () => stepRate(-1), "]": () => stepRate(1),
      c: () => $("bsub").hidden || $("bsub").click(), n: () => next(), b: addMark, Escape: () => pl.classList.contains("pfs") ? pseudoFs(false) : pl.classList.contains("wfs") && toggleWfs()
    };
    const fn = map[k.length === 1 ? k.toLowerCase() : k];
    if (fn) { e.preventDefault(); fn(); poke(); return; }
    if (/^[0-9]$/.test(k) && v.duration) { v.currentTime = v.duration * +k / 10; poke(); }
  });
  addEventListener("keyup", e => {
    if (e.key !== "ArrowRight" || !rightDown) return;
    clearTimeout(rightHoldT); rightDown = 0;
    if (holding) holdOff(); else { seek(5); center("5 秒 »"); }
  });
  addEventListener("blur", () => { rightDown = 0; clearTimeout(rightHoldT); holdOff(); });

  // ---------- media session (lock screen buttons) ----------
  if ("mediaSession" in navigator) {
    const ms = navigator.mediaSession;
    try { ms.setActionHandler("seekbackward", () => seek(-10)); ms.setActionHandler("seekforward", () => seek(10)); ms.setActionHandler("nexttrack", () => next()); } catch (e) {}
  }

  // ---------- start ----------
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  $("auto").checked = ls.get("pl-auto") !== "0";
  $("auto").onchange = () => ls.set("pl-auto", $("auto").checked ? "1" : "0");
  paintRate(); paintPc(); $("bpc").onclick = () => { if (askPc()) renderList(); };
  async function start() {
    try { S.lib = await loadLib(); } catch (e) { S.lib = { courses: [] }; toast("录播列表读取失败（" + e.message + "），还可以打开本地视频。"); }
    paintPc();
    await offRefresh();
    firstSync();
    await Promise.race([pull().then(push), new Promise(r => setTimeout(r, 3000))]);
    setInterval(() => { if (!document.hidden) pull().then(() => { renderList(); renderMarks(); }); }, 60000);
    const cid = ls.get("pl-course"), last = ls.get("pl-last");
    S.course = S.lib.courses.find(c => c.id === cid) || S.lib.courses.find(c => c.items.some(ok)) || S.lib.courses[0] || null;
    renderChips(); renderList();
    for (const co of S.lib.courses) { const it = co.items.find(i => i.id === last && ok(i) && (i.url || pcBase())); if (it) { openItem(co, it, false); break; } }
  }
  (async () => {
    const saved = ls.get("st-key");
    if (saved) { try { if (await tryKey(await crypto.subtle.importKey("raw", b64.dec(saved), "AES-GCM", true, ["encrypt", "decrypt"]))) return start(); } catch (e) {} }
    $("lock").hidden = false; $("pw").focus();
  })();
  $("lockf").onsubmit = async e => {
    e.preventDefault(); $("pwb").disabled = true; $("pwerr").textContent = "";
    try { if (await unlockWith($("pw").value)) { $("lock").hidden = true; start(); } else $("pwerr").textContent = "密码不对"; }
    catch (x) { $("pwerr").textContent = "出错了：" + x.message; }
    $("pwb").disabled = false;
  };
})();
</script>
</body>
